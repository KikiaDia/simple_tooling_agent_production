[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-tool-calling-agent-production"
version = "0.1.0"
description = "Industrialized Databricks tool-calling agent example"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
databricks = [
  "databricks-sdk>=0.60",
  "mlflow>=3.1.3",
  "openai-agents>=0.2",
  "databricks-openai",
]
dev = [
  "black>=24.8",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: tests requiring external services / Databricks",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["simple_agent"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["simple_agent"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
