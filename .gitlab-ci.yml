default:
  image: python:3.11-slim
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  AGENT_BACKEND: "fake"

cache:
  paths:
    - .cache/pip

stages:
  - quality
  - test
  - evaluate
  - registry
  - package
  - validate
  - deploy_staging
  - smoke
  - deploy_prod

.python_setup:
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

quality:
  extends: .python_setup
  stage: quality
  script:
    - ruff check src tests evaluation scripts
    - black --check src tests evaluation scripts
    - mypy src/simple_agent

unit_tests:
  extends: .python_setup
  stage: test
  script:
    - pytest tests/unit -q --cov=simple_agent --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

functional_tests:
  extends: .python_setup
  stage: test
  script:
    - pytest tests/functional -q

integration_tests:
  extends: .python_setup
  stage: test
  rules:
    - if: '$RUN_DATABRICKS_INTEGRATION == "1"'
  script:
    - pip install -e ".[databricks]"
    - pytest tests/integration -q -m integration

genai_quality_gate:
  extends: .python_setup
  stage: evaluate
  script:
    - python evaluation/run_offline_eval.py
  artifacts:
    when: always
    paths:
      - evaluation/results/offline_eval.json

release_manifest:
  extends: .python_setup
  stage: package
  script:
    - python scripts/release_manifest.py
  artifacts:
    paths:
      - release-manifest.json

bundle_validate_staging:
  stage: validate
  image: databrickscli/cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - databricks bundle validate -t staging

deploy_staging:
  stage: deploy_staging
  image: databrickscli/cli:latest
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - databricks bundle deploy -t staging

smoke_staging:
  extends: .python_setup
  stage: smoke
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - test -n "$STAGING_APP_URL"
    - python scripts/smoke_test.py

bundle_validate_prod:
  stage: deploy_prod
  image: databrickscli/cli:latest
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - databricks bundle validate -t prod

deploy_prod:
  stage: deploy_prod
  image: databrickscli/cli:latest
  environment:
    name: production
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - databricks bundle deploy -t prod


# ---- Reproducibility / registry gates ----
# These jobs are intentionally explicit/manual where registry mutation occurs.
# Promotion should happen only after evaluation of the exact prompt/model/dataset coordinates.

sync_eval_dataset:
  extends: .python_setup
  stage: registry
  rules:
    - if: '$SYNC_EVAL_DATASET == "1"'
  script:
    - pip install -e ".[databricks]"
    - python scripts/sync_eval_dataset.py

register_prompt_version:
  extends: .python_setup
  stage: registry
  rules:
    - if: '$REGISTER_PROMPT == "1"'
  script:
    - pip install -e ".[databricks]"
    - python scripts/register_prompt.py

promote_prompt_staging:
  extends: .python_setup
  stage: deploy_staging
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - pip install -e ".[databricks]"
    - python scripts/promote_prompt.py --name "$PROMPT_NAME" --from-alias dev --to-alias staging

promote_prompt_production:
  extends: .python_setup
  stage: deploy_prod
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - pip install -e ".[databricks]"
    - python scripts/promote_prompt.py --name "$PROMPT_NAME" --from-alias staging --to-alias production
